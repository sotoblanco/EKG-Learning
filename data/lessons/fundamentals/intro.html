<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKG Master: Interactive Fundamentals</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script>window.react = window.React;</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .font-sans { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Outfit', sans-serif; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-slow { animation: pulse-slow 3s infinite; }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            ChevronLeft, ChevronRight, BookOpen, Activity, Zap, Brain, 
            CheckCircle2, Eye, Timer 
        } = window.LucideReact;

        const COURSE_DATA = [
          {
            chapter: 1,
            title: "Basic Principles",
            frames: [
              {
                id: "1-1",
                text: "In 1790, Luigi Galvani made a dead frog's legs dance by electrical stimulation. Completing a circuit connecting dissimilar metals created a stimulating __________ current.",
                answer: "electrical",
                hint: "Starts with e...",
                image: "frog"
              },
              {
                id: "1-2",
                text: "In 1855, Kollicker and Mueller found that when a motor nerve to a frog's leg was laid over its isolated beating heart, the leg kicked. They assumed the heart beating must be due to rhythmic discharge of __________ stimuli.",
                answer: "electrical",
                hint: "Same word as before!",
                image: "heart_concept"
              },
              {
                id: "1-3",
                text: "The electrocardiogram is known by three letters: __________. It provides a record of cardiac electrical activity.",
                answer: "EKG",
                hint: "Or ECG, but we use Dubin's preference...",
                image: "ekg_strip"
              },
              {
                id: "1-4",
                text: "The EKG records the electrical activity of contraction of the heart muscle, also known as the __________.",
                answer: "myocardium",
                hint: "myo = muscle, cardium = heart",
                image: "heart_anatomy"
              },
              {
                id: "1-5",
                text: "The interiors of heart muscle cells (myocytes) are negative at rest. When they become positive and contract, we say they have __________.",
                answer: "depolarized",
                hint: "The opposite of polarized",
                image: "depolarization_wave"
              },
              {
                id: "1-6",
                text: "The recovery phase that follows depolarization, where cell interiors return to a negative charge, is known as __________.",
                answer: "repolarization",
                hint: "The 're'covery phase",
                image: "repolarization_wave"
              }
            ]
          },
          {
            chapter: 2,
            title: "Recording the EKG",
            frames: [
              {
                id: "2-1",
                text: "The EKG is recorded on ruled paper. The smallest divisions are __________ millimeter (mm) squares.",
                answer: "one",
                hint: "1...",
                image: "grid"
              },
              {
                id: "2-2",
                text: "Between the heavy black lines on EKG paper, there are __________ small squares.",
                answer: "5",
                hint: "A standard grouping",
                image: "grid_zoom"
              },
              {
                id: "2-3",
                text: "The horizontal axis on EKG paper represents __________. Each small division represents .04 seconds.",
                answer: "time",
                hint: "Left to right measures...",
                image: "time_axis"
              },
              {
                id: "2-4",
                text: "A standard EKG is composed of __________ separate leads.",
                answer: "12",
                hint: "The 'dozen' leads",
                image: "leads_12"
              },
              {
                id: "2-5",
                text: "Leads I, II, and III are called __________ limb leads because they use a pair of electrodes (one positive, one negative).",
                answer: "bipolar",
                hint: "Two poles",
                image: "bipolar_leads"
              }
            ]
          },
          {
            chapter: 3,
            title: "Autonomic Nervous System",
            frames: [
              {
                id: "3-1",
                text: "The Autonomic Nervous System (ANS) regulates vital functions. The __________ system secretes Norepinephrine to accelerate the heart rate.",
                answer: "sympathetic",
                hint: "Fight or flight",
                image: "ans_diagram"
              },
              {
                id: "3-2",
                text: "The __________ system secretes Acetylcholine to slow the heart rate.",
                answer: "parasympathetic",
                hint: "Rest and digest",
                image: "ans_diagram"
              },
              {
                id: "3-3",
                text: "The vagus nerves are the body's main __________ pathway. Vagal stimulation slows the heart.",
                answer: "parasympathetic",
                hint: "Starts with p...",
                image: "vagus"
              },
              {
                id: "3-4",
                text: "Sympathetic stimulation of arterial alpha-1 receptors causes __________ of arteries, increasing blood pressure.",
                answer: "constriction",
                hint: "Narrowing",
                image: "artery"
              }
            ]
          },
          {
            chapter: 4,
            title: "Rate",
            frames: [
              {
                id: "4-1",
                text: "The SA Node is the heart's primary __________. Its inherent rate is 60 to 100 beats per minute.",
                answer: "pacemaker",
                hint: "It sets the pace...",
                image: "sa_node"
              },
              {
                id: "4-2",
                text: "To determine the rate, find an R wave on a heavy black line. The next three heavy lines represent the 'first triplet': 300, 150, and __________.",
                answer: "100",
                hint: "Halfway between 200 and 0...",
                image: "triplet_1"
              },
              {
                id: "4-3",
                text: "The 'second triplet' follows the 100 mark. These three lines represent 75, 60, and __________.",
                answer: "50",
                hint: "Half of 100",
                image: "triplet_2"
              },
              {
                id: "4-4",
                text: "If the heart rate is faster than 100 beats per minute, it is called __________.",
                answer: "tachycardia",
                hint: "tachy- means fast",
                image: "tachycardia"
              },
              {
                id: "4-5",
                text: "If the heart rate is slower than 60 beats per minute, it is called __________.",
                answer: "bradycardia",
                hint: "brady- means slow",
                image: "bradycardia"
              },
              {
                id: "4-6",
                text: "For very slow or irregular rates, count the cycles on a 6-second strip and multiply by __________ to get the rate per minute.",
                answer: "10",
                hint: "6 seconds x ? = 60 seconds",
                image: "six_second"
              }
            ]
          }
        ];

        // Helper to count total frames
        const TOTAL_FRAMES = COURSE_DATA.reduce((acc, ch) => acc + ch.frames.length, 0);

        const HeartSVG = () => (
          <svg viewBox="0 0 200 200" className="w-full h-full max-h-48 md:max-h-64">
            <path d="M100 180 C 20 120, 20 60, 100 40 C 180 60, 180 120, 100 180" fill="#fecaca" stroke="#dc2626" strokeWidth="4" />
            <path d="M100 40 L 100 180" stroke="#dc2626" strokeWidth="2" strokeDasharray="4" />
            <circle cx="70" cy="80" r="15" fill="#ef4444" opacity="0.6" />
            <circle cx="130" cy="80" r="15" fill="#ef4444" opacity="0.6" />
          </svg>
        );

        const GridSVG = ({ rateLines = [] }) => (
          <svg viewBox="0 0 300 100" className="w-full h-full bg-red-50 rounded-lg">
            {[...Array(30)].map((_, i) => (
              <line key={`v-${i}`} x1={i * 10} y1="0" x2={i * 10} y2="100" stroke="#fca5a5" strokeWidth={i % 5 === 0 ? 1 : 0.2} />
            ))}
            {[...Array(10)].map((_, i) => (
              <line key={`h-${i}`} x1="0" y1={i * 10} x2="300" y2={i * 10} stroke="#fca5a5" strokeWidth={i % 5 === 0 ? 1 : 0.2} />
            ))}
            {/* R waves */}
            <path d="M10 50 L 30 50 L 35 10 L 40 50 L 60 50" fill="none" stroke="#111" strokeWidth="1.5" />
            {rateLines.map((line, idx) => (
              <g key={idx}>
                <text x={40 + (idx + 1) * 50} y="15" fontSize="8" textAnchor="middle" className="fill-slate-500 font-bold">{line}</text>
                <line x1={40 + (idx + 1) * 50} y1="20" x2={40 + (idx + 1) * 50} y2="100" stroke="#ef4444" strokeWidth="0.5" strokeDasharray="2" />
              </g>
            ))}
          </svg>
        );

        const App = () => {
          const [activeChapterIdx, setActiveChapterIdx] = useState(0);
          const [activeFrameIdx, setActiveFrameIdx] = useState(0);
          const [userInput, setUserInput] = useState('');
          const [isCorrect, setIsCorrect] = useState(false);
          const [showHint, setShowHint] = useState(false);
          const [showSolution, setShowSolution] = useState(false);
          const [completedFrames, setCompletedFrames] = useState(new Set());
          const inputRef = useRef(null);
          const contentRef = useRef(null);

          const currentChapter = COURSE_DATA[activeChapterIdx];
          const currentFrame = currentChapter.frames[activeFrameIdx];

          const handleInputChange = (e) => {
            const val = e.target.value;
            setUserInput(val);
            if (val.toLowerCase().trim() === currentFrame.answer.toLowerCase()) {
              setIsCorrect(true);
              setCompletedFrames(prev => new Set(prev).add(currentFrame.id));
            }
          };

          const nextFrame = () => {
            if (activeFrameIdx < currentChapter.frames.length - 1) {
              setActiveFrameIdx(activeFrameIdx + 1);
            } else if (activeChapterIdx < COURSE_DATA.length - 1) {
              setActiveChapterIdx(activeChapterIdx + 1);
              setActiveFrameIdx(0);
            }
            resetState();
          };

          const prevFrame = () => {
            if (activeFrameIdx > 0) {
              setActiveFrameIdx(activeFrameIdx - 1);
            } else if (activeChapterIdx > 0) {
              setActiveChapterIdx(activeChapterIdx - 1);
              setActiveFrameIdx(COURSE_DATA[activeChapterIdx - 1].frames.length - 1);
            }
            resetState();
          };

          const resetState = () => {
            setUserInput('');
            setIsCorrect(false);
            setShowHint(false);
            setShowSolution(false);
            if (contentRef.current) contentRef.current.scrollTo(0, 0);
          };

          const revealSolution = () => {
            setShowSolution(true);
            setUserInput(currentFrame.answer);
            setIsCorrect(true);
            setCompletedFrames(prev => new Set(prev).add(currentFrame.id));
          };

          useEffect(() => {
            if (inputRef.current) inputRef.current.focus();
          }, [activeFrameIdx, activeChapterIdx]);

          return (
            <div className="flex flex-col md:flex-row h-screen bg-slate-50 font-sans text-slate-800 overflow-hidden">
              {/* Sidebar Navigation */}
              <aside className="hidden md:flex w-64 bg-white border-r border-slate-200 p-6 flex-col shadow-sm shrink-0">
                <div className="flex items-center gap-2 mb-8">
                  <Activity className="text-red-600 w-6 h-6" />
                  <h1 className="font-bold text-xl tracking-tight">EKG Master</h1>
                </div>
                
                <nav className="flex-1 space-y-2 overflow-y-auto">
                  {COURSE_DATA.map((ch, idx) => (
                    <button
                      key={ch.chapter}
                      onClick={() => { setActiveChapterIdx(idx); setActiveFrameIdx(0); resetState(); }}
                      className={`w-full text-left p-3 rounded-lg text-sm transition-all flex items-center gap-3 ${
                        activeChapterIdx === idx 
                        ? 'bg-red-50 text-red-700 font-semibold shadow-inner' 
                        : 'hover:bg-slate-100 text-slate-600'
                      }`}
                    >
                      <div className={`w-6 h-6 rounded-full flex items-center justify-center text-xs shrink-0 ${
                        activeChapterIdx === idx ? 'bg-red-600 text-white' : 'bg-slate-200 text-slate-500'
                      }`}>
                        {ch.chapter}
                      </div>
                      <span className="truncate">{ch.title}</span>
                    </button>
                  ))}
                </nav>

                <div className="mt-auto pt-6 border-t border-slate-100">
                  <div className="text-xs text-slate-400 mb-2 font-bold uppercase">Progress</div>
                  <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                    <div 
                      className="bg-green-500 h-full transition-all duration-500" 
                      style={{ width: `${(completedFrames.size / TOTAL_FRAMES) * 100}%` }}
                    />
                  </div>
                  <div className="text-[10px] mt-1 text-slate-400 text-right font-medium">
                    {completedFrames.size} / {TOTAL_FRAMES} Frames
                  </div>
                </div>
              </aside>

              {/* Main Content Area */}
              <main className="flex-1 flex flex-col h-full overflow-hidden">
                {/* Sticky Header */}
                <header className="bg-white border-b border-slate-200 p-4 flex items-center justify-between shadow-sm px-6 md:px-8 z-10">
                  <div className="flex items-center gap-4">
                    <span className="hidden sm:inline text-xs font-bold uppercase tracking-widest text-slate-400">Chapter {currentChapter.chapter}</span>
                    <h2 className="text-sm md:text-lg font-bold text-slate-700 truncate max-w-[150px] sm:max-w-none">{currentChapter.title}</h2>
                  </div>
                  <div className="flex items-center gap-2 md:gap-4">
                    <div className="flex gap-1 md:gap-2">
                      <button 
                        onClick={prevFrame}
                        disabled={activeChapterIdx === 0 && activeFrameIdx === 0}
                        className="p-1.5 md:p-2 hover:bg-slate-100 rounded-full disabled:opacity-30 transition-colors"
                      >
                        <ChevronLeft size={20} />
                      </button>
                      <span className="flex items-center text-xs md:text-sm font-bold text-slate-500 min-w-[50px] justify-center">
                        {activeFrameIdx + 1} / {currentChapter.frames.length}
                      </span>
                      <button 
                        onClick={nextFrame}
                        disabled={activeChapterIdx === COURSE_DATA.length - 1 && activeFrameIdx === currentChapter.frames.length - 1}
                        className="p-1.5 md:p-2 hover:bg-slate-100 rounded-full disabled:opacity-30 transition-colors"
                      >
                        <ChevronRight size={20} />
                      </button>
                    </div>
                  </div>
                </header>

                {/* Scrollable Content Body */}
                <div ref={contentRef} className="flex-1 overflow-y-auto p-4 md:p-8 bg-slate-50">
                  <div className="max-w-3xl mx-auto space-y-6 md:space-y-8 pb-12">
                    
                    {/* Visual Aid Card */}
                    <div className="bg-white p-4 md:p-6 rounded-2xl md:rounded-3xl shadow-md border border-slate-200 flex items-center justify-center min-h-[200px] md:min-h-[300px]">
                      <div className="w-full max-w-lg">
                        {currentFrame.image === 'frog' && <Zap className="w-24 h-24 md:w-32 md:h-32 text-yellow-400 drop-shadow-lg mx-auto" />}
                        {currentFrame.image === 'heart_concept' && <HeartSVG />}
                        {currentFrame.image === 'grid' && <GridSVG />}
                        {currentFrame.image === 'triplet_1' && <GridSVG rateLines={["Start", "300", "150", "100"]} />}
                        {currentFrame.image === 'triplet_2' && <GridSVG rateLines={["100", "75", "60", "50"]} />}
                        {currentFrame.image === 'tachycardia' && <div className="text-center font-bold text-red-600 animate-pulse text-4xl">&gt; 100 BPM</div>}
                        {currentFrame.image === 'bradycardia' && <div className="text-center font-bold text-blue-600 text-4xl">&lt; 60 BPM</div>}
                        {currentFrame.image === 'sa_node' && <div className="relative"><HeartSVG /><Zap className="absolute top-10 left-1/2 -translate-x-1/2 text-yellow-500 w-12 h-12" /></div>}
                        {currentFrame.image === 'ans_diagram' && <Brain className="w-24 h-24 md:w-32 md:h-32 text-blue-400 drop-shadow-md mx-auto" />}
                        {!currentFrame.image && <BookOpen className="w-24 h-24 md:w-32 md:h-32 text-slate-200 mx-auto" />}
                      </div>
                    </div>

                    {/* Content Frame Card */}
                    <div className="bg-white p-6 md:p-8 rounded-2xl md:rounded-3xl shadow-md border border-slate-200 relative overflow-hidden transition-all">
                      {isCorrect && !showSolution && (
                        <div className="absolute top-2 right-2 md:top-4 md:right-4 p-2 animate-in zoom-in duration-300">
                          <CheckCircle2 className="text-green-500 w-6 h-6 md:w-8 md:h-8" />
                        </div>
                      )}
                      
                      <div className="text-lg md:text-xl leading-relaxed text-slate-700 mb-8 font-medium">
                        {currentFrame.text.split('__________').map((part, i, arr) => (
                          <React.Fragment key={i}>
                            {part}
                            {i !== arr.length - 1 && (
                              <span className="inline-block mx-1 relative group align-baseline">
                                <input
                                  ref={inputRef}
                                  type="text"
                                  value={userInput}
                                  onChange={handleInputChange}
                                  disabled={isCorrect}
                                  placeholder="..."
                                  className={`border-b-2 bg-transparent text-center outline-none transition-all px-1 py-0 ${
                                    isCorrect 
                                    ? (showSolution ? 'border-blue-500 text-blue-600 font-bold italic' : 'border-green-500 text-green-600 font-bold') 
                                    : 'border-slate-300 focus:border-red-500 text-red-600'
                                  }`}
                                  style={{ width: `${Math.max(currentFrame.answer.length * 1, 6)}ch` }}
                                />
                              </span>
                            )}
                          </React.Fragment>
                        ))}
                      </div>

                      <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-6 border-t border-slate-100">
                        <div className="flex gap-4">
                          <button 
                            onClick={() => { setShowHint(!showHint); setShowSolution(false); }}
                            className={`text-xs font-bold uppercase tracking-widest transition-colors ${showHint ? 'text-red-600' : 'text-slate-400 hover:text-slate-600'}`}
                          >
                            {showHint ? 'Hide Hint' : 'Hint'}
                          </button>
                          <button 
                            onClick={revealSolution}
                            className="flex items-center gap-1 text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-blue-600 transition-colors"
                          >
                            <Eye size={14} />
                            Solution
                          </button>
                        </div>

                        {isCorrect && (
                          <button 
                            onClick={nextFrame}
                            className="w-full sm:w-auto flex items-center justify-center gap-2 px-8 py-3 bg-red-600 text-white rounded-xl font-bold shadow-lg shadow-red-100 hover:bg-red-700 transition-all transform hover:scale-105 active:scale-95"
                          >
                            Continue
                            <ChevronRight size={18} />
                          </button>
                        )}
                      </div>

                      {showHint && !showSolution && (
                        <div className="mt-4 p-3 bg-red-50 text-red-700 rounded-lg text-sm font-medium animate-in slide-in-from-top-2 border border-red-100">
                          <span className="font-bold">Hint:</span> {currentFrame.hint}
                        </div>
                      )}
                      
                      {showSolution && (
                        <div className="mt-4 p-3 bg-blue-50 text-blue-700 rounded-lg text-sm font-medium animate-in slide-in-from-top-2 border border-blue-100">
                          <span className="font-bold">Solution:</span> The correct answer is <span className="underline decoration-2">{currentFrame.answer}</span>.
                        </div>
                      )}
                    </div>

                    {/* Note Section */}
                    <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-100 text-xs md:text-sm text-yellow-800 italic">
                      <strong>Dubin's Tip:</strong> Memory is best served by repetition. Repeat the triplets out loud: 300, 150, 100... 75, 60, 50!
                    </div>
                  </div>
                </div>

                {/* Mobile Navigation Footer */}
                <div className="md:hidden bg-white border-t border-slate-200 p-3 flex justify-around items-center shrink-0">
                  <button onClick={() => setActiveChapterIdx(Math.max(0, activeChapterIdx - 1))} className="flex flex-col items-center gap-1">
                    <BookOpen size={20} className={activeChapterIdx === 0 ? 'text-slate-300' : 'text-slate-600'} />
                    <span className="text-[10px] font-bold text-slate-400">Prev Ch</span>
                  </button>
                  <div className="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center text-white shadow-lg">
                    <Timer size={24} />
                  </div>
                  <button onClick={() => setActiveChapterIdx(Math.min(COURSE_DATA.length - 1, activeChapterIdx + 1))} className="flex flex-col items-center gap-1">
                    <Zap size={20} className={activeChapterIdx === COURSE_DATA.length - 1 ? 'text-slate-300' : 'text-slate-600'} />
                    <span className="text-[10px] font-bold text-slate-400">Next Ch</span>
                  </button>
                </div>
              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
