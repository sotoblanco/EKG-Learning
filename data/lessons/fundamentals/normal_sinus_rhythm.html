<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            padding: 32px;
            line-height: 1.6;
            margin: 0;
        }
        h1 { color: #0284c7; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-top: 0; }
        .highlight {
            background-color: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 16px;
            margin: 24px 0;
            border-radius: 0 8px 8px 0;
        }
    </style>
</head>
<body>
    <h1>Normal Sinus Rhythm (NSR)</h1>
    <p>Normal Sinus Rhythm is the standard rhythm of a healthy heart, originating from the SA node.</p>
    
    <div class="highlight">
        <strong>Criteria for NSR:</strong>
        <ul>
            <li>Rate: 60 - 100 bpm</li>
            <li>Rhythm: Regular</li>
            <li>P waves: Present, upright in II, and precede every QRS complex</li>
            <li>PR Interval: Normal (0.12 - 0.20s)</li>
        </ul>
    </div>
</body>
</html>
