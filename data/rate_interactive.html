<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKG Master: Chapter 4 - Rate</title>

    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script>window.react = window.React;</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @keyframes slide-in-from-top {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in { animation: slide-in-from-top 0.2s ease-out; }

        @keyframes zoom-in {
            from { opacity: 0; transform: scale(0.92); }
            to   { opacity: 1; transform: scale(1); }
        }
        .animate-zoom-in { animation: zoom-in 0.25s ease-out; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const {
            ChevronLeft, ChevronRight, Activity, CheckCircle2,
            Eye, Timer, Info
        } = LucideReact;

        const RATE_CHAPTER = {
            title: "Chapter 4: Rate",
            frames: [
                {
                    id: "4-1",
                    text: "The SA Node is the heart's primary __________. It normally generates rhythmic impulses at a rate of 60 to 100 per minute.",
                    answer: "pacemaker",
                    hint: "It sets the 'pace' of the heart.",
                    image: "sa_node"
                },
                {
                    id: "4-2",
                    text: "To calculate rate, find an R wave that peaks on a heavy black line. The next heavy black line represents a rate of __________.",
                    answer: "300",
                    hint: "The first number in the triplet sequence.",
                    image: "triplet_300"
                },
                {
                    id: "4-3",
                    text: "The sequence of the first three heavy lines (the first triplet) after the start line is 300, 150, and __________.",
                    answer: "100",
                    hint: "300, 150, ...",
                    image: "triplet_100"
                },
                {
                    id: "4-4",
                    text: "The next three heavy lines (the second triplet) represent 75, 60, and __________.",
                    answer: "50",
                    hint: "The end of the 300-150-100, 75-60-... sequence.",
                    image: "triplet_50"
                },
                {
                    id: "4-5",
                    text: "A heart rate greater than 100 beats per minute is called __________.",
                    answer: "tachycardia",
                    hint: "Tachy- means fast.",
                    image: "tachycardia"
                },
                {
                    id: "4-6",
                    text: "A heart rate less than 60 beats per minute is called __________.",
                    answer: "bradycardia",
                    hint: "Brady- means slow.",
                    image: "bradycardia"
                },
                {
                    id: "4-7",
                    text: "For irregular or very slow rhythms, count the number of cycles in a 6-second strip and multiply by __________ to find the rate per minute.",
                    answer: "10",
                    hint: "6 seconds x [?] = 60 seconds.",
                    image: "multiply_10"
                }
            ]
        };

        const HeartSVG = ({ pulse = false }) => (
            <svg viewBox="0 0 200 200" className={`w-full h-full max-h-48 ${pulse ? 'animate-pulse' : ''}`}>
                <path d="M100 180 C 20 120, 20 60, 100 40 C 180 60, 180 120, 100 180" fill="#fee2e2" stroke="#ef4444" strokeWidth="4" />
                <path d="M100 40 L 100 180" stroke="#f87171" strokeWidth="2" strokeDasharray="4" />
                <circle cx="100" cy="60" r="10" fill="#dc2626" className={pulse ? 'animate-ping' : ''} />
            </svg>
        );

        const EKGGrid = ({ labels = [] }) => (
            <svg viewBox="0 0 400 120" className="w-full h-full bg-red-50 rounded-lg shadow-inner border border-red-100">
                {/* Small Grid */}
                {[...Array(40)].map((_, i) => (
                    <line key={`v-small-${i}`} x1={i * 10} y1="0" x2={i * 10} y2="120" stroke="#fca5a5" strokeWidth="0.2" />
                ))}
                {[...Array(12)].map((_, i) => (
                    <line key={`h-small-${i}`} x1="0" y1={i * 10} x2="400" y2={i * 10} stroke="#fca5a5" strokeWidth="0.2" />
                ))}
                {/* Large Grid */}
                {[...Array(9)].map((_, i) => (
                    <line key={`v-large-${i}`} x1={i * 50} y1="0" x2={i * 50} y2="120" stroke="#fca5a5" strokeWidth="1" />
                ))}
                {[...Array(3)].map((_, i) => (
                    <line key={`h-large-${i}`} x1="0" y1={i * 50} x2="400" y2={i * 50} stroke="#fca5a5" strokeWidth="1" />
                ))}

                {/* Baseline and QRS complex */}
                <path d="M0 70 L 40 70 L 45 60 L 50 70 L 55 10 L 65 110 L 70 70 L 100 70" fill="none" stroke="#1e293b" strokeWidth="2" />

                {/* Dynamic Labels */}
                {labels.map((label, idx) => {
                    const xPos = 55 + (idx * 50);
                    return (
                        <g key={idx}>
                            <text x={xPos} y="20" textAnchor="middle" fontSize="9" fontWeight="bold" fill="#dc2626">{label}</text>
                            <line x1={xPos} y1="25" x2={xPos} y2="120" stroke="#ef4444" strokeWidth="2" strokeDasharray="4" />
                        </g>
                    );
                })}
            </svg>
        );

        const App = () => {
            const [frameIdx, setFrameIdx] = useState(0);
            const [userInput, setUserInput] = useState('');
            const [isCorrect, setIsCorrect] = useState(false);
            const [showHint, setShowHint] = useState(false);
            const [showSolution, setShowSolution] = useState(false);
            const [completed, setCompleted] = useState(new Set());

            const inputRef = useRef(null);
            const currentFrame = RATE_CHAPTER.frames[frameIdx];

            const handleInputChange = (e) => {
                const val = e.target.value;
                setUserInput(val);
                if (val.toLowerCase().trim() === currentFrame.answer.toLowerCase()) {
                    setIsCorrect(true);
                    setCompleted(prev => new Set(prev).add(currentFrame.id));
                }
            };

            const revealSolution = () => {
                setShowSolution(true);
                setUserInput(currentFrame.answer);
                setIsCorrect(true);
                setCompleted(prev => new Set(prev).add(currentFrame.id));
            };

            const resetFrame = () => {
                setUserInput('');
                setIsCorrect(false);
                setShowHint(false);
                setShowSolution(false);
                if (inputRef.current) inputRef.current.focus();
            };

            const nextFrame = () => {
                if (frameIdx < RATE_CHAPTER.frames.length - 1) {
                    setFrameIdx(frameIdx + 1);
                    resetFrame();
                }
            };

            const prevFrame = () => {
                if (frameIdx > 0) {
                    setFrameIdx(frameIdx - 1);
                    resetFrame();
                }
            };

            useEffect(() => {
                if (inputRef.current) inputRef.current.focus();
            }, [frameIdx]);

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col font-sans text-slate-800">
                    {/* Top Header */}
                    <header className="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-20 shadow-sm flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="bg-red-600 p-2 rounded-lg">
                                <Timer className="text-white w-5 h-5" />
                            </div>
                            <div>
                                <h1 className="font-bold text-slate-900 leading-none">Rate Master</h1>
                                <p className="text-xs text-slate-500 mt-1 uppercase tracking-wider font-bold">{RATE_CHAPTER.title}</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-4">
                            <div className="hidden sm:flex flex-col items-end mr-4">
                                <div className="text-[10px] font-bold text-slate-400 uppercase">Progress</div>
                                <div className="w-32 h-1.5 bg-slate-200 rounded-full mt-1 overflow-hidden">
                                    <div
                                        className="bg-green-500 h-full transition-all duration-500"
                                        style={{ width: `${(completed.size / RATE_CHAPTER.frames.length) * 100}%` }}
                                    />
                                </div>
                            </div>
                            <div className="flex items-center bg-slate-100 rounded-full px-2 py-1">
                                <button
                                    onClick={prevFrame}
                                    disabled={frameIdx === 0}
                                    className="p-1 hover:bg-white rounded-full disabled:opacity-30 transition-all"
                                >
                                    <ChevronLeft size={18} />
                                </button>
                                <span className="px-3 text-xs font-bold text-slate-600">
                                    {frameIdx + 1} / {RATE_CHAPTER.frames.length}
                                </span>
                                <button
                                    onClick={nextFrame}
                                    disabled={frameIdx === RATE_CHAPTER.frames.length - 1}
                                    className="p-1 hover:bg-white rounded-full disabled:opacity-30 transition-all"
                                >
                                    <ChevronRight size={18} />
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto w-full p-4 md:p-8 flex flex-col items-center">
                        <div className="w-full max-w-2xl space-y-6">

                            {/* Illustration Card */}
                            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center justify-center min-h-[250px] overflow-hidden">
                                <div className="w-full">
                                    {currentFrame.image === "sa_node" && <HeartSVG pulse={true} />}
                                    {currentFrame.image === "triplet_300" && <EKGGrid labels={["START", "300"]} />}
                                    {currentFrame.image === "triplet_100" && <EKGGrid labels={["START", "300", "150", "100"]} />}
                                    {currentFrame.image === "triplet_50"  && <EKGGrid labels={["100", "75", "60", "50"]} />}
                                    {currentFrame.image === "tachycardia" && (
                                        <div className="text-center py-8">
                                            <Activity className="w-16 h-16 text-red-500 mx-auto animate-pulse" />
                                            <div className="text-4xl font-black text-red-600 mt-4">FAST</div>
                                            <div className="text-slate-400 font-bold">&gt; 100 BPM</div>
                                        </div>
                                    )}
                                    {currentFrame.image === "bradycardia" && (
                                        <div className="text-center py-8">
                                            <Activity className="w-16 h-16 text-blue-500 mx-auto" />
                                            <div className="text-4xl font-black text-blue-600 mt-4">SLOW</div>
                                            <div className="text-slate-400 font-bold">&lt; 60 BPM</div>
                                        </div>
                                    )}
                                    {currentFrame.image === "multiply_10" && (
                                        <div className="flex flex-col items-center justify-center gap-4 py-8">
                                            <div className="text-6xl font-black text-slate-200">6s &times; 10</div>
                                            <div className="bg-slate-800 text-white px-4 py-1 rounded-full text-xs font-bold tracking-wider">THE 6-SECOND METHOD</div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Interactive Lesson Card */}
                            <div className="bg-white rounded-3xl border border-slate-200 shadow-lg overflow-hidden">
                                <div className="p-8">
                                    <div className="text-xl md:text-2xl font-medium leading-relaxed text-slate-700">
                                        {currentFrame.text.split('__________').map((part, i, arr) => (
                                            <React.Fragment key={i}>
                                                {part}
                                                {i !== arr.length - 1 && (
                                                    <span className="inline-block relative align-baseline mx-1">
                                                        <input
                                                            ref={inputRef}
                                                            type="text"
                                                            value={userInput}
                                                            onChange={handleInputChange}
                                                            disabled={isCorrect}
                                                            placeholder="..."
                                                            className={`border-b-4 bg-transparent text-center outline-none transition-all px-2 py-0 font-bold ${
                                                                isCorrect
                                                                ? (showSolution ? 'border-blue-400 text-blue-600' : 'border-green-500 text-green-600')
                                                                : 'border-slate-200 focus:border-red-500 text-red-600'
                                                            }`}
                                                            style={{ width: `${Math.max(currentFrame.answer.length + 1, 8)}ch` }}
                                                        />
                                                    </span>
                                                )}
                                            </React.Fragment>
                                        ))}
                                    </div>
                                </div>

                                {/* Actions Bar */}
                                <div className="bg-slate-50 border-t border-slate-100 p-6 flex flex-col sm:flex-row items-center justify-between gap-4">
                                    <div className="flex items-center gap-4">
                                        <button
                                            onClick={() => { setShowHint(!showHint); setShowSolution(false); }}
                                            className="text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-slate-600 flex items-center gap-1 transition-colors"
                                        >
                                            <Info size={14} />
                                            {showHint ? 'Hide Hint' : 'Hint'}
                                        </button>
                                        <button
                                            onClick={revealSolution}
                                            className="text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-blue-600 flex items-center gap-1 transition-colors"
                                        >
                                            <Eye size={14} />
                                            Show Solution
                                        </button>
                                    </div>

                                    {isCorrect ? (
                                        <button
                                            onClick={nextFrame}
                                            disabled={frameIdx === RATE_CHAPTER.frames.length - 1}
                                            className="w-full sm:w-auto bg-red-600 hover:bg-red-700 disabled:opacity-40 text-white px-8 py-3 rounded-2xl font-bold shadow-lg shadow-red-100 flex items-center justify-center gap-2 transition-all transform hover:scale-105 active:scale-95"
                                        >
                                            Next Frame
                                            <ChevronRight size={20} />
                                        </button>
                                    ) : (
                                        <div className="text-xs font-bold text-slate-400 italic">Type the missing word above...</div>
                                    )}
                                </div>
                            </div>

                            {/* Feedback Area */}
                            <div className="space-y-3">
                                {showHint && !isCorrect && (
                                    <div className="bg-red-50 border border-red-100 p-4 rounded-2xl text-sm font-medium text-red-700 animate-slide-in">
                                        <span className="font-bold mr-2">HINT:</span>{currentFrame.hint}
                                    </div>
                                )}

                                {showSolution && (
                                    <div className="bg-blue-50 border border-blue-100 p-4 rounded-2xl text-sm font-medium text-blue-700 animate-slide-in">
                                        <span className="font-bold mr-2">SOLUTION:</span>The correct term is <span className="underline font-bold">{currentFrame.answer}</span>.
                                    </div>
                                )}

                                {isCorrect && !showSolution && (
                                    <div className="bg-green-50 border border-green-100 p-4 rounded-2xl text-sm font-bold text-green-700 flex items-center gap-2 animate-zoom-in">
                                        <CheckCircle2 size={18} />
                                        Excellent! You've mastered this concept.
                                    </div>
                                )}
                            </div>

                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 p-4 text-center">
                        <p className="text-xs text-slate-400 font-medium">
                            Based on Dr. Dale Dubin's Rapid Interpretation of EKG's (6th Ed.)
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
